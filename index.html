<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighthouse Media Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: #1e293b; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        input, button { padding: 10px; margin: 6px 0; border-radius: 4px; border: none; font-size: 14px; }
        input { width: calc(100% - 22px); background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
        .danger { background: #ef4444; }
        .danger:hover { background: #dc2626; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .media-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
        .media-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .media-title { font-weight: bold; margin: 8px 0 4px 0; }
        .media-owner { font-size: 11px; color: #94a3b8; word-break: break-all; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Lighthouse Media Storage</h1>

    <div class="card">
        <button onclick="connectWallet()">Connect Wallet</button>
        <p id="accountText">Status: Not connected</p>
    </div>

    <div class="card">
        <h3>Upload to Lighthouse & Save to Contract</h3>
        <input type="text" id="apiKeyInput" placeholder="Enter Lighthouse API Key">
        <input type="text" id="titleInput" placeholder="Enter Image Title">
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="uploadAndSave()">Upload & Save</button>
    </div>

    <h2>Media Gallery</h2>
    <div id="mediaGrid" class="grid"></div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@lighthouse-web3/sdk@0.2.5/dist/index.browser.min.js"></script>
    <script>
        const contractAddress = "0x38cB7800C3Fddb8dda074C1c650A155154924C73";
        const contractABI = [
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "uint256", "name": "id", "type": "uint256" },
                    { "indexed": true, "internalType": "address", "name": "owner", "type": "address" },
                    { "indexed": false, "internalType": "string", "name": "cid", "type": "string" },
                    { "indexed": false, "internalType": "string", "name": "title", "type": "string" }
                ],
                "name": "MediaAdded",
                "type": "event"
            },
            {
                "anonymous": false,
                "inputs": [
                    { "indexed": true, "internalType": "uint256", "name": "id", "type": "uint256" },
                    { "indexed": true, "internalType": "address", "name": "owner", "type": "address" }
                ],
                "name": "MediaDeleted",
                "type": "event"
            },
            {
                "inputs": [
                    { "internalType": "string", "name": "_cid", "type": "string" },
                    { "internalType": "string", "name": "_title", "type": "string" }
                ],
                "name": "addMedia",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [
                    { "internalType": "uint256", "name": "_id", "type": "uint256" }
                ],
                "name": "deleteMedia",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getAllMedia",
                "outputs": [
                    {
                        "components": [
                            { "internalType": "uint256", "name": "id", "type": "uint256" },
                            { "internalType": "address", "name": "owner", "type": "address" },
                            { "internalType": "string", "name": "cid", "type": "string" },
                            { "internalType": "string", "name": "title", "type": "string" },
                            { "internalType": "bool", "name": "isDeleted", "type": "bool" }
                        ],
                        "internalType": "struct MediaManager.Media[]",
                        "name": "",
                        "type": "tuple[]"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        let web3;
        let contract;
        let userAccount = "";

        async function connectWallet() {
            if (window.ethereum) {
                web3 = new Web3(window.ethereum);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAccount = accounts[0];
                document.getElementById('accountText').innerText = `Connected: ${userAccount}`;
                contract = new web3.eth.Contract(contractABI, contractAddress);
                loadMedia();
            } else {
                alert("Please install MetaMask!");
            }
        }

        async function uploadAndSave() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const title = document.getElementById('titleInput').value.trim();
            const fileInput = document.getElementById('fileInput');

            if (!apiKey || !title || fileInput.files.length === 0 || !contract || !userAccount) {
                alert("Please fill all fields and select a file.");
                return;
            }

            try {
                const output = await lighthouse.upload(fileInput.files, apiKey);
                const cid = output.data.Hash;

                await contract.methods.addMedia(cid, title).send({ from: userAccount });
                
                document.getElementById('titleInput').value = '';
                fileInput.value = '';
                loadMedia();
            } catch (error) {
                console.error("Upload failed", error);
            }
        }

        async function deleteMedia(id) {
            if (!contract || !userAccount) return;
            await contract.methods.deleteMedia(id).send({ from: userAccount });
            loadMedia();
        }

        async function loadMedia() {
            if (!contract) return;

            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = 'Loading media...';

            const mediaList = await contract.methods.getAllMedia().call();
            grid.innerHTML = '';

            mediaList.forEach(item => {
                if (item.isDeleted) return;

                const isOwner = userAccount && item.owner.toLowerCase() === userAccount.toLowerCase();
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <img src="https://gateway.lighthouse.storage/ipfs/${item.cid}" alt="${item.title}">
                    <div class="media-title">${item.title}</div>
                    <div class="media-owner">Owner: ${item.owner}</div>
                    ${isOwner ? `<button class="danger" onclick="deleteMedia(${item.id})">Delete Image</button>` : ''}
                `;
                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = '<p>No active media found.</p>';
            }
        }
    </script>
</body>
</html>
